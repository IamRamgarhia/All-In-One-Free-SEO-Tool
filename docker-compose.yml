services:
  seo:
    build:
      context: .
      dockerfile: Dockerfile
    image: seo-tool:local
    restart: unless-stopped
    ports:
      # Host port respects $SEO_HOST_PORT (set by install.sh/.ps1 when 3000
      # is occupied). Container always serves on 3000.
      #
      # Bound to 127.0.0.1 deliberately. The bare "3000:3000" form this
      # used to carry publishes on 0.0.0.0, so `docker compose up -d` on
      # a VPS put every client's data, all saved API keys, and the
      # browser-driving endpoints on the public internet with no
      # authentication — while the .cmd/.sh launchers correctly default
      # to loopback. Same product, opposite exposure, depending only on
      # how you started it.
      #
      # To reach it from another machine, do BOTH:
      #   1. set APP_PASSWORD (see below) — otherwise there is no auth
      #   2. set SEO_BIND_ADDR=0.0.0.0
      # Better still, leave this alone and put a reverse proxy with TLS
      # in front of 127.0.0.1.
      - "${SEO_BIND_ADDR:-127.0.0.1}:${SEO_HOST_PORT:-3000}:3000"
    environment:
      # Password gate. Required for any non-loopback bind — the
      # entrypoint refuses to start without it (see docker-entrypoint).
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Set to 1 when running behind nginx/Caddy/Cloudflare so
      # x-forwarded-for is trusted for the admin-endpoint IP check.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      # All user state lives in /data (mounted volume): data.db,
      # encryption key, port memory, screenshots. One backup target.
      SEO_DATA_DIR: /data
      SEO_DB_PATH: /data/data.db
      RUNNING_IN_DOCKER: "1"
      # Optional: bake in Google OAuth so users get one-click sign-in.
      # GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      # GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Optional: PageSpeed Insights API key (free, 25k/day)
      # PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      # Optional: pre-set AI provider keys instead of the UI flow
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # GROQ_API_KEY: ${GROQ_API_KEY:-}
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      # OLLAMA_URL: http://ollama:11434
    volumes:
      - seo-data:/data

  # Optional sidecar — local LLM for fully offline AI features.
  # Uncomment + run `docker compose up ollama` to use.
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  seo-data:
  # ollama-data:
