services:
  seo:
    build:
      context: .
      dockerfile: Dockerfile
    image: seo-tool:local
    restart: unless-stopped
    ports:
      # Host port respects $SEO_HOST_PORT (set by install.sh/.ps1 when 3000
      # is occupied). Container always serves on 3000.
      #
      # Bound to 127.0.0.1 deliberately. The bare "3000:3000" form this
      # used to carry publishes on 0.0.0.0, so `docker compose up -d` on
      # a VPS put every client's data, all saved API keys, and the
      # browser-driving endpoints on the public internet with no
      # authentication — while the .cmd/.sh launchers correctly default
      # to loopback. Same product, opposite exposure, depending only on
      # how you started it.
      #
      # To reach it from another machine, do BOTH:
      #   1. set APP_PASSWORD (see below) — otherwise there is no auth
      #   2. set SEO_BIND_ADDR=0.0.0.0
      # Better still, leave this alone and put a reverse proxy with TLS
      # in front of 127.0.0.1.
      - "${SEO_BIND_ADDR:-127.0.0.1}:${SEO_HOST_PORT:-3000}:3000"
    environment:
      # Password gate. Required for any non-loopback bind — the
      # entrypoint refuses to start without it (see docker-entrypoint).
      #
      # This is the one-password mode: everyone who has it is the same
      # anonymous user. If more than one person uses this instance, open
      # Settings → Team and register instead. Accounts supersede this
      # password — once they exist, APP_PASSWORD no longer gets anyone in.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Optional. Signs session cookies once accounts are in use. Leave
      # unset and one is generated into /data/.seo-session-secret on
      # first boot; set it explicitly if you run more than one replica,
      # since each would otherwise generate its own and reject the
      # other's cookies. Losing it logs everyone out and nothing more —
      # it is not the encryption key, and no stored data depends on it.
      SEO_SESSION_SECRET: ${SEO_SESSION_SECRET:-}
      # Set to 1 when terminating TLS somewhere this container can't
      # see (some tunnels), to force Secure on the session cookie.
      # Normally unnecessary — x-forwarded-proto is honoured.
      SEO_COOKIE_SECURE: ${SEO_COOKIE_SECURE:-}
      # Set to 1 when running behind nginx/Caddy/Cloudflare so
      # x-forwarded-for is trusted for the admin-endpoint IP check.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      # All user state lives in /data (mounted volume): data.db,
      # encryption key, port memory, screenshots. One backup target.
      SEO_DATA_DIR: /data
      SEO_DB_PATH: /data/data.db
      RUNNING_IN_DOCKER: "1"
      # Optional: bake in Google OAuth so users get one-click sign-in.
      # GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      # GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Optional: PageSpeed Insights API key (free, 25k/day)
      # PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      # Optional: pre-set AI provider keys instead of the UI flow
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # GROQ_API_KEY: ${GROQ_API_KEY:-}
      # OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      # TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      # GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # OLLAMA_URL: http://ollama:11434
      #
      # Every provider in PROVIDER_CATALOG (src/lib/api-providers.ts) is
      # above, and ai-provider-env.test.ts fails the build if one is
      # missing. Mistral support landed on 11 May 2026 and was absent
      # from this file for the sixteen releases after it, while the app
      # read MISTRAL_API_KEY the whole time. A community PR is how it
      # was found — two hand-kept lists against one declared source.
      #
      # Rank checking via the searxng profile below. Set unconditionally
      # rather than commented out: if the profile is not running, the
      # app's provider gets a connection error and falls through to the
      # next source, which is the same thing that happens with no URL
      # set at all. Pointing at a service that may not exist costs
      # nothing; making the user edit two files to turn rank checking on
      # is what made it a dead end.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    volumes:
      - seo-data:/data

  # Rank checking that works on a fresh install.
  #
  #   docker compose --profile searxng up -d
  #
  # Behind a profile rather than always-on: it is a second container on a
  # box this project promises will run on a $5 VPS, and an install that
  # only ever uses Search Console does not need it.
  #
  # Why it is here at all: of the four rank sources, Search Console needs
  # a verified property, Brave needs a key, and the headless browser is
  # blocked — measured 30 Oct 2026, Google returned a JS interstitial,
  # DuckDuckGo a CAPTCHA, Bing and Startpage empty shells. So without
  # this, a new user with no Google property has no working rank source
  # and nothing tells them why.
  #
  # NOT published to the host. An open SearXNG is an open proxy, and this
  # one runs with its rate limiter off because the only client is the app
  # on the same compose network.
  searxng:
    image: searxng/searxng:latest
    profiles: ["searxng"]
    restart: unless-stopped
    environment:
      # SearXNG refuses to start on the default placeholder secret.
      # Generate one: openssl rand -hex 32   (see docs/HOSTING.md)
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: http://searxng:8080/
      # See the comment on general.contact_url in docker/searxng/settings.yml.
      SEARXNG_CONTACT_URL: ${SEARXNG_CONTACT_URL:-false}
    volumes:
      # Read-only: the app never needs to write SearXNG's config, and the
      # one line that matters (json in search.formats) should not be
      # editable by the container.
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    # No `ports:` on purpose — see above.
    expose:
      - "8080"

  # Optional sidecar — local LLM for fully offline AI features.
  # Uncomment + run `docker compose up ollama` to use.
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  seo-data:
  # ollama-data:
