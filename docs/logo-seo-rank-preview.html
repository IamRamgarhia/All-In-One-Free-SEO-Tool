<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Logo seo_rank — aperçu</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0c1018;
        color: #e8eef6;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        color: #8496b0;
        max-width: 36rem;
        font-size: 0.92rem;
      }
      .panel {
        margin-top: 1.5rem;
        padding: 2.5rem;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: #111721;
      }
      .panel.light {
        background: #f4f6fa;
        color: #1a2744;
      }
      img {
        max-width: 100%;
        height: auto;
      }
      code {
        background: rgba(255, 255, 255, 0.06);
        padding: 0.15em 0.4em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Logo retenu — proche de &lt;seo_rank/&gt;.io</h1>
    <p>
      Marque : balise auto-fermante + <code>seo</code> atténué + <code>_rank</code> plein +
      <code>.io</code>. Domaine à acheter : <strong>seo-rank.io</strong> (sans balises).
    </p>
    <div class="panel">
      <img src="../public/brand-seo-rank-lockup.svg" width="400" alt="Lockup seo_rank" />
    </div>
    <div class="panel light" style="margin-top: 1rem">
      <img src="../public/brand-seo-rank-lockup.svg" width="400" alt="" />
    </div>
    <div class="panel" style="margin-top: 1rem; display: flex; gap: 2rem; align-items: center">
      <img src="../public/logo-mark.svg" width="80" alt="Picto" />
      <img src="../public/icon.svg" width="80" alt="Favicon 512" />
    </div>
    <p style="margin-top: 2rem">
      Dans l’app : composant <code>SeoRankBrand</code> · login
      <code>http://localhost:3000/login</code>
    </p>
  </body>
</html>
