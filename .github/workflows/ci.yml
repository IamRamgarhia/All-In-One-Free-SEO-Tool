name: CI

# The repo shipped for months with `@hello-pangea/dnd` imported by
# src/app/tasks/kanban-board.tsx but absent from package.json — so a
# clean clone could not build and /tasks could not render. Nothing
# caught it because nothing ever ran `pnpm install && pnpm build` from
# scratch. That is this workflow's job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml
      # disagree, which is what an undeclared import looks like once
      # someone adds it locally without committing the lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Hard gate, zero tolerance. The repo was at 75 errors + 93 warnings
      # when CI was introduced; both are now at zero, and two of the
      # "warnings" turned out to be real bugs hiding in the noise (an
      # unfiltered client-scoped query, a transparent chart fill).
      #
      # --max-warnings=0 is the point: a warning nobody fails on is a
      # warning nobody reads, and that is exactly how those two survived.
      # If a new one is genuinely fine, mark it — underscore-prefix an
      # intentionally-unused binding, or add a disable with the reason.
      - name: Lint
        run: pnpm lint -- --max-warnings=0

      - name: Test
        run: pnpm test

      # Runs migrations against a scratch DB then builds. Catches both
      # broken migrations and any module that fails to resolve.
      - name: Build
        run: pnpm build
        env:
          SEO_DB_PATH: ${{ runner.temp }}/ci.db

      # E2E covers what unit tests structurally can't: whether a page
      # actually renders in a browser. /tasks was importing a dependency
      # that wasn't installed for months, and no amount of server-side
      # testing would have caught it — the route 500'd only once React
      # tried to render the component.
      #
      # Also guards the client-side state work (sidebar collapse, tool
      # pinning, theme), where the server HTML is identical whether the
      # behaviour works or not.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e
        env:
          CI: "1"

      # Load every page and report anything that doesn't render.
      #
      # E2E covers a handful of screens deliberately and well. This
      # covers all 226 shallowly: does the page return 200 at all. That
      # is the exact question nothing could answer when /tasks imported a
      # package missing from package.json and 500'd for months —
      # typecheck passed, the build passed, and the failure only happened
      # when React tried to render.
      #
      # Runs against an empty database on purpose: every page must cope
      # with having no data, which is the state every new install is in
      # and the one least likely to have been clicked through.
      - name: Route sweep (all pages render)
        run: |
          export SEO_DB_PATH="${{ runner.temp }}/sweep.db"
          export SEO_DATA_DIR="${{ runner.temp }}"
          node scripts/migrate.cjs
          PORT=3200 pnpm start &
          server=$!
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3200/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/route-sweep.mjs http://localhost:3200 "$SEO_DB_PATH"
          status=$?
          kill $server 2>/dev/null || true
          exit $status

      # The agent's safety properties, against a real database.
      #
      # Every one of them is silent when broken: an agent that ignores
      # its own cooldown still produces a tidy run log, and one that
      # "applies" a change without recording the previous value looks
      # identical to one that did — until someone needs to undo it on a
      # client's live website.
      #
      # The first version of this check reported 15/15 while the run was
      # throwing, because it only asserted the summary was long enough to
      # read. It now fails loudly on a crashed run.
      - name: Agent safety checks
        run: |
          export SEO_DB_PATH="${{ runner.temp }}/agent.db"
          export SEO_DATA_DIR="${{ runner.temp }}"
          node scripts/migrate.cjs
          pnpm exec tsx scripts/agent-check.ts

      # Crawls example.com, so it needs the network. Kept here rather
      # than in the unit suite because the property being checked is that
      # a real crawl's page count survives into the database — a fixture
      # would only prove the fixture round-trips.
      - name: Audit page-count check
        run: |
          export SEO_DB_PATH="${{ runner.temp }}/audit.db"
          export SEO_DATA_DIR="${{ runner.temp }}"
          node scripts/migrate.cjs
          node -e "
            const D=require('better-sqlite3');
            const db=new D(process.env.SEO_DB_PATH);
            db.prepare('INSERT INTO clients (name, url) VALUES (?, ?)')
              .run('CI Test Client','https://example.com');
            db.close();
          "
          pnpm exec tsx scripts/audit-pagecount-check.ts

      # Bulk reporting has one property that must never regress: a batch
      # produces DRAFTS. If it ever marks its own output approved, the
      # review step becomes decoration and reports go to clients unread —
      # and it would look completely normal from the outside, just with
      # an empty review queue.
      #
      # Renders real PDFs, so it needs a database with a client in it.
      - name: Report batch checks
        run: |
          export SEO_DB_PATH="${{ runner.temp }}/reports.db"
          export SEO_DATA_DIR="${{ runner.temp }}"
          node scripts/migrate.cjs
          node -e "
            const D=require('better-sqlite3');
            const db=new D(process.env.SEO_DB_PATH);
            db.prepare('INSERT INTO clients (name, url) VALUES (?, ?)')
              .run('CI Test Client','https://example.com');
            db.close();
          "
          pnpm exec tsx scripts/report-batch-check.ts

      # The auth gate cannot be tested in-process. Middleware runs in the
      # Edge sandbox and learns the auth mode from the Node runtime, and
      # the first version of that handshake silently failed: registering
      # the first owner issued a correct session and left every page
      # reachable with no cookie at all, until someone restarted the
      # server. Nothing above would have caught it — the unit tests were
      # green, the build was green, and the bug only exists across the
      # two runtimes.
      #
      # Needs its own database because it registers a permanent owner.
      - name: Auth flow (real server, scratch DB)
        run: |
          export SEO_DB_PATH="${{ runner.temp }}/auth.db"
          export SEO_DATA_DIR="${{ runner.temp }}"
          node scripts/migrate.cjs
          PORT=3100 pnpm start &
          server=$!
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3100/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/auth-check.mjs http://localhost:3100 "$SEO_DB_PATH"
          status=$?
          kill $server 2>/dev/null || true
          exit $status

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Separate job, because the failure it catches has nothing to do with
  # the one above.
  #
  # A user's install died at `RUN pnpm build` inside Docker while the
  # same commit built fine natively. Three causes, none visible to the
  # job above: pnpm-workspace.yaml wasn't COPYied into the deps stage,
  # `corepack prepare pnpm@latest` floated the image onto a different
  # pnpm than the lockfile, and `pnpm build` silently triggers an install
  # that doesn't inherit --ignore-scripts.
  #
  # Docker is the documented install path for non-technical users. It
  # needs its own gate.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: seo-tool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building isn't enough — the image also has to boot, run
      # migrations against an empty volume, and serve. A container that
      # builds and then crash-loops is the same outcome for the user.
      - name: Boot the container and wait for health
        run: |
          docker run -d --name seo-ci \
            -p 3000:3000 \
            -e APP_PASSWORD=ci-smoke-test \
            -v seo-ci-data:/data \
            seo-tool:ci

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              exit 0
            fi
            if ! docker ps --filter name=seo-ci --filter status=running -q | grep -q .; then
              echo "container exited early:"
              docker logs seo-ci
              exit 1
            fi
            sleep 1
          done

          echo "never became healthy:"
          docker logs seo-ci
          exit 1

      # The password gate must not block the endpoints that carry their
      # own auth — that regression shipped once and made client portals
      # and the public API unreachable on every real deployment.
      - name: Password gate lets through what it should
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/health)
          [ "$code" = "200" ] || { echo "health behind auth: $code"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -L http://localhost:3000/)
          [ "$code" = "200" ] || { echo "login page not served: $code"; exit 1; }

      # The container refuses to start without APP_PASSWORD. Verify that
      # guard actually fires, or it's decoration.
      - name: Refuses to boot unauthenticated
        run: |
          if docker run --rm --name seo-ci-noauth seo-tool:ci 2>&1 | tee /tmp/out; then
            echo "started without APP_PASSWORD — the guard did not fire"
            exit 1
          fi
          grep -q "REFUSING TO START" /tmp/out || {
            echo "failed for the wrong reason:"; cat /tmp/out; exit 1; }

      - name: Container logs on failure
        if: failure()
        run: docker logs seo-ci || true
