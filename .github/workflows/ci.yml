name: CI

# The repo shipped for months with `@hello-pangea/dnd` imported by
# src/app/tasks/kanban-board.tsx but absent from package.json — so a
# clean clone could not build and /tasks could not render. Nothing
# caught it because nothing ever ran `pnpm install && pnpm build` from
# scratch. That is this workflow's job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml
      # disagree, which is what an undeclared import looks like once
      # someone adds it locally without committing the lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Hard gate. The repo was at ~75 errors when CI was introduced —
      # almost all React 19's `set-state-in-effect` rule catching real
      # double-render patterns. Those are fixed; the handful of effects
      # that are genuinely correct carry a per-line disable with the
      # reason. Keeping this blocking is what stops the count creeping
      # back up.
      #
      # Warnings are not failed on: the repo has ~93, mostly unused vars
      # in work-in-progress code, and failing on those would push people
      # toward deleting useful scaffolding rather than finishing it.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Runs migrations against a scratch DB then builds. Catches both
      # broken migrations and any module that fails to resolve.
      - name: Build
        run: pnpm build
        env:
          SEO_DB_PATH: ${{ runner.temp }}/ci.db

      # E2E covers what unit tests structurally can't: whether a page
      # actually renders in a browser. /tasks was importing a dependency
      # that wasn't installed for months, and no amount of server-side
      # testing would have caught it — the route 500'd only once React
      # tried to render the component.
      #
      # Also guards the client-side state work (sidebar collapse, tool
      # pinning, theme), where the server HTML is identical whether the
      # behaviour works or not.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e
        env:
          CI: "1"

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
