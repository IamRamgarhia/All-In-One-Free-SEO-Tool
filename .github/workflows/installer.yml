name: Installers

# Builds everything a user downloads: the Windows .exe, and the prebuilt
# payloads the macOS/Linux one-liner fetches.
#
# This workflow is the ONLY place any of it has ever been compiled. A
# typical developer machine has no .NET SDK and no Inno Setup (checked on
# the maintainer's: neither, plus no csc), and a macOS payload cannot be
# built on Windows at all — `pnpm install --prod` compiles
# better-sqlite3 and @resvg/resvg-js for whichever platform it runs on.
# So the first real run is the first proof any of this works.
#
# Deliberately NOT part of a release. Nothing here attaches an asset to
# anything; every job ends in upload-artifact, which produces a private
# build you download from the Actions tab. Putting an unverified
# installer in front of users is the thing this avoids.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the filenames (defaults to package.json)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # One source for the version, so a run cannot produce an .exe and a
  # payload that disagree about what they are.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(node -p "require('./package.json').version")
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
          echo "Building installers for ${v#v}"

  # ───────────────────────────────────────────────────────────────────
  # The prebuilt payloads: what install-prebuilt.sh downloads instead of
  # building from source.
  #
  # One per platform AND per Node major, because the payload contains
  # native modules compiled against a single Node ABI — 20 is 115, 22 is
  # 127, 24 is 137, 26 is 147. A node-22 payload unpacked under Node 26
  # fails at startup with ERR_DLOPEN_FAILED, which reads as a corrupt
  # download rather than a version mismatch. The asset name carries the
  # major so the installer fetches the right one.
  #
  # Node 22 only for now: it is the LTS the lockfile's native modules are
  # routinely built against, and adding majors multiplies the matrix.
  # Adding 24 later is one line here.
  # ───────────────────────────────────────────────────────────────────
  payload:
    needs: version
    strategy:
      # One platform failing must not cancel the others. On a first run
      # that is the difference between learning about one problem and
      # learning about all of them.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS arm64
          # macos-15-intel, NOT macos-13.
          #
          # macos-13 was retired on 4 December 2025 — a year ago. A job
          # asking for a label that no longer exists does not fail: it
          # sits in "queued" forever, which is the worst possible
          # failure mode because it is indistinguishable from waiting
          # for a busy runner. Measured on the first real run: queued 12
          # minutes, never started, while the other three jobs finished.
          #
          # macos-15-intel is the last x86_64 macOS image GitHub will
          # publish, supported to August 2027. After that there is no
          # hosted Intel Mac and this payload has to be cross-compiled
          # or dropped. Intel Macs still in use in 2027 will be ~5 years
          # past the architecture transition, so dropping it is the
          # likely answer — but not while people are running them.
          - os: macos-15-intel
            name: macOS x86_64
          # 24.04, not latest. GitHub moved ubuntu-latest to 26.04,
          # which Playwright 1.59.1 refuses outright — and more
          # importantly for a PAYLOAD, native modules compiled against
          # 26.04's glibc may not load on an older distro. 24.04 is
          # "noble", the same base as this project's Docker image, so a
          # payload built here runs in more places.
          - os: ubuntu-24.04
            name: Linux x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: payload (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          # Must match the `node22` in the asset name below. Node 25+
          # also ships no corepack, which is why pnpm is installed by the
          # action above rather than enabled through it.
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm build

      - name: Build the payload
        # Runs a real `pnpm install --prod --node-linker=hoisted`, probes
        # that the result actually loads (SQLite round-trip plus a
        # Playwright require), and deletes the whole payload if it finds
        # a private file.
        run: node scripts/build-payload.mjs --out dist/payload

      - name: Package it
        run: node scripts/build-prebuilt-zip.mjs --payload dist/payload --out dist

      - name: Check the asset name carries THIS run's version
        shell: bash
        run: |
          set -euo pipefail
          # build-prebuilt-zip.mjs names the asset from package.json.
          # This workflow's version comes from the tag or a dispatch
          # input. When those disagree — tag v0.10.2 pushed while
          # package.json still says 0.10.1 — the release carries
          # `...-0.10.1-...` while install-prebuilt.sh asks the release
          # API for `...-0.10.2-...` and reports "no prebuilt payload at
          # all", which sounds like the build failed rather than like
          # two version numbers drifting apart.
          #
          # The one-liner matches by EXACT name on purpose (taking the
          # first .zip is the bug that shipped in v0.10.0's updater), so
          # an off-by-one version is a total failure, not a warning.
          want="${{ needs.version.outputs.version }}"
          zip=$(ls dist/seo-tool-prebuilt-*.zip)
          case "$(basename "$zip")" in
            seo-tool-prebuilt-"${want}"-*) echo "::notice::asset is $(basename "$zip")" ;;
            *)
              echo "::error::this run builds ${want} but the asset is named $(basename "$zip") — package.json and the tag disagree, and install-prebuilt.sh matches by exact name"
              exit 1
              ;;
          esac

      - name: Check the manifest describes this runner
        shell: bash
        run: |
          set -euo pipefail
          # The asset name is derived from payload.json, so a wrong
          # manifest produces a correctly-named lie — a darwin filename
          # on a linux payload. Cheap to assert, impossible to notice
          # later.
          node - <<'JS'
          const { readFileSync } = require("node:fs");
          const m = JSON.parse(readFileSync("dist/payload/payload.json", "utf8"));
          const expected = process.platform;
          if (m.platform !== expected) {
            console.error(`::error::payload.json says ${m.platform}, runner is ${expected}`);
            process.exit(1);
          }
          const major = Number(m.nodeVersion.replace(/^v/, "").split(".")[0]);
          if (major !== 22) {
            console.error(`::error::payload built on Node ${major}, expected 22`);
            process.exit(1);
          }
          console.log(`payload.json ok: ${m.platform}-${m.arch}, ${m.nodeVersion}, ABI ${m.nodeModuleVersion}`);
          JS

      - name: Refuse to ship a database
        shell: bash
        run: |
          set -euo pipefail
          # build-payload scans and deletes on a hit; this is the last
          # gate before an artefact anyone can download. Build output has
          # carried the maintainer's live database once already.
          found=$(find dist/payload \
            \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \
            -o -name '.env' -o -name '.env.local' \) -print | head -20)
          if [ -n "$found" ]; then
            echo "::error::private files in the payload:"
            echo "$found"
            exit 1
          fi
          echo "payload is clean"

      - name: Report size
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls dist/seo-tool-prebuilt-*.zip)
          size=$(( $(wc -c < "$zip") / 1048576 ))
          echo "::notice::$(basename "$zip") — ${size} MB"
          # A plausible range. Under 40 means the payload did not make it
          # in; over 600 means something unintended did.
          if [ "$size" -lt 40 ] || [ "$size" -gt 600 ]; then
            echo "::error::${size} MB is outside the expected range"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.os }}
          path: dist/seo-tool-prebuilt-*.zip
          if-no-files-found: error
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────
  # The Windows installer. Never compiled anywhere but here.
  # ───────────────────────────────────────────────────────────────────
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm build

      - name: Build the payload
        run: node scripts/build-payload.mjs --out dist/installer-payload

      # ─── Portable Node ──────────────────────────────────────────────
      - name: Fetch node.exe and verify its checksum
        shell: bash
        run: |
          set -euo pipefail
          # Must match setup-node above: the payload's native modules are
          # compiled against one NODE_MODULE_VERSION, and a mismatched
          # runtime fails with ERR_DLOPEN_FAILED at startup — the error
          # this project already hit when a developer's Node moved under
          # an install.
          NODE_VERSION="$(node -p 'process.versions.node')"
          echo "Bundling Node v${NODE_VERSION}"

          base="https://nodejs.org/dist/v${NODE_VERSION}"
          pkg="node-v${NODE_VERSION}-win-x64.zip"

          curl -fsSL -o "$pkg" "${base}/${pkg}"
          curl -fsSL -o SHASUMS256.txt "${base}/SHASUMS256.txt"

          # Against Node's own published list. An installer that bundles
          # a runtime it has not checked is one that can be made to ship
          # somebody else's binary.
          grep " ${pkg}\$" SHASUMS256.txt > expected.txt
          sha256sum -c expected.txt

          unzip -q "$pkg"
          mkdir -p dist/installer-node
          cp "node-v${NODE_VERSION}-win-x64/node.exe" dist/installer-node/
          ls -l dist/installer-node/

      # ─── The native window ──────────────────────────────────────────
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish the host
        run: >
          dotnet publish installer/host/SeoToolHost.csproj
          -c Release
          -o dist/installer-host

      - name: Check the host actually produced an exe
        shell: bash
        run: |
          # dotnet publish has exited 0 having produced nothing before.
          # Named explicitly so a silent failure does not become an
          # installer missing its own application.
          test -f "dist/installer-host/SEO Tool.exe" \
            || { echo "::error::host exe was not produced"; exit 1; }
          ls -l "dist/installer-host/SEO Tool.exe"

      # ─── Package ────────────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: cmd
        run: >
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ needs.version.outputs.version }}
          /DPayloadDir=..\dist\installer-payload
          /DHostDir=..\dist\installer-host
          /DNodeDir=..\dist\installer-node
          installer\seo-tool.iss

      - name: Report what was built
        shell: bash
        run: |
          set -euo pipefail
          out="dist/SEO-Tool-Setup-${{ needs.version.outputs.version }}.exe"
          test -f "$out" || { echo "::error::installer not found at $out"; exit 1; }
          size=$(( $(stat -c%s "$out") / 1048576 ))
          echo "::notice::Installer built: ${out} (${size} MB)"
          if [ "$size" -lt 40 ] || [ "$size" -gt 600 ]; then
            echo "::error::${size} MB is outside the expected range — check the payload"
            exit 1
          fi

      - name: Refuse to ship a database
        shell: bash
        run: |
          set -euo pipefail
          found=$(find dist/installer-payload \
            \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \
            -o -name '.env' -o -name '.env.local' \) -print | head -20)
          if [ -n "$found" ]; then
            echo "::error::private files in the payload:"
            echo "$found"
            exit 1
          fi
          echo "payload is clean"

      - uses: actions/upload-artifact@v4
        with:
          name: SEO-Tool-Setup-${{ needs.version.outputs.version }}
          path: dist/SEO-Tool-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  # The checksums the one-liner verifies, over every payload in one run.
  # Written here rather than per-job because a SHA256SUMS.txt per platform
  # is three files the installer would have to guess between.
  checksums:
    needs: [version, payload]
    # `!cancelled()` rather than the default, which is "every leg of
    # `payload` succeeded".
    #
    # With fail-fast: false the matrix is explicitly allowed to lose one
    # platform — but the default `needs` behaviour then SKIPS this job,
    # so one dead runner label means no SHA256SUMS.txt for the platforms
    # that built fine, and the one-liner has nothing to verify for any
    # of them. Measured: the macos-13 leg queued forever, and the Linux
    # and macOS-arm64 payloads it had already produced got no checksums.
    #
    # The step below names which platforms are covered and which are
    # missing, so a partial file cannot be mistaken for a complete one.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: payloads
      - shell: bash
        run: |
          set -euo pipefail
          cd payloads
          # `sha256sum *.zip` with no matches would checksum the literal
          # string "*.zip" and exit 1 — a confusing way to learn that
          # every payload leg failed.
          count=$(ls -1 *.zip 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no payloads were produced — every platform leg failed"
            exit 1
          fi
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # Say when one is MISSING. A SHA256SUMS.txt covering two of
          # three platforms looks complete until someone on the third
          # tries to install.
          #
          # 3 is the number of legs in the `payload` matrix above, and
          # NOT a second list of platform names — the names live in
          # build-prebuilt-zip.mjs, which owns them. workflow-runners.test.ts
          # asserts this number and the matrix agree, because a fourth
          # platform added above and not here would make a 3-of-4 run
          # report itself complete.
          expected=3
          if [ "$count" -lt "$expected" ]; then
            echo "::warning::only ${count} of ${expected} payloads built — the missing platform has no checksum and its one-liner will fall back to building from source"
          else
            echo "::notice::all ${expected} payloads checksummed"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: payloads/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────
  # Attach everything to a DRAFT release. Only on a tag.
  #
  # WHY A DRAFT, AND WHY THIS JOB EXISTS AT ALL
  #
  # install-prebuilt.sh — the macOS/Linux one-liner — asks the GitHub
  # API for the LATEST RELEASE and then matches an asset by exact name.
  # Artifacts on the Actions tab are invisible to it: they need a token
  # and a different API. So for as long as nothing attached a payload to
  # a release, the documented one-liner could not work for anybody, and
  # it said so honestly ("carries no prebuilt payload at all") — an
  # honest message about a feature that did not exist.
  #
  # A DRAFT is the resolution. `/releases/latest` excludes drafts and
  # prereleases, so nothing here reaches a user until a human presses
  # Publish — which keeps the rule this workflow was written around:
  # "attaching an unverified installer to a release puts it in front of
  # users before anybody has double-clicked it once". The checklist in
  # installer/README.md is what Publish means.
  #
  # Partial is allowed and is REPORTED. If the Windows leg failed, the
  # draft still carries the payloads, and its body says the .exe is
  # missing — a draft nobody can see is the right place for an
  # incomplete set, and refusing to make one would mean a single dead
  # runner label blocks every platform again.
  # ───────────────────────────────────────────────────────────────────
  release:
    needs: [version, payload, windows, checksums]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      # The only job in this workflow that can write to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: in

      - name: Assemble, and re-verify the checksums
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # download-artifact without merge-multiple puts each artifact
          # in its own directory, so flatten by find rather than by
          # guessing the layout.
          find in -type f \( -name 'seo-tool-prebuilt-*.zip' -o -name 'SEO-Tool-Setup-*.exe' -o -name 'SHA256SUMS.txt' \) \
            -exec cp {} out/ \;
          ls -l out/

          payloads=$(ls -1 out/seo-tool-prebuilt-*.zip 2>/dev/null | wc -l)
          exes=$(ls -1 out/SEO-Tool-Setup-*.exe 2>/dev/null | wc -l)

          if [ "$payloads" -eq 0 ] && [ "$exes" -eq 0 ]; then
            echo "::error::nothing was built — refusing to create an empty draft"
            exit 1
          fi

          # The checksums were computed in the `checksums` job over its
          # own download. Re-verifying here proves the artifacts
          # round-tripped through the artifact store unchanged — which
          # matters because this file is what the one-liner trusts
          # instead of the bytes it just downloaded.
          if [ -f out/SHA256SUMS.txt ]; then
            ( cd out && sha256sum -c SHA256SUMS.txt ) \
              || { echo "::error::a payload does not match SHA256SUMS.txt"; exit 1; }
            echo "checksums verified"
          elif [ "$payloads" -gt 0 ]; then
            echo "::error::payloads exist but SHA256SUMS.txt does not — the one-liner verifies it"
            exit 1
          fi

          {
            echo "payloads=${payloads}"
            echo "exes=${exes}"
          } >> "$GITHUB_OUTPUT"

      - name: Write the draft body
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          {
            echo "## Install"
            echo
            echo '**Windows** — download `SEO-Tool-Setup-'"${v}"'.exe` below and run it.'
            echo
            echo '**macOS / Linux** — one line, no toolchain:'
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install-prebuilt.sh | bash"
            echo '```'
            echo
            echo "Needs Node 20–26. The payload carries compiled native modules, so there is one"
            echo "asset per platform and per Node major; the script picks its own and refuses a"
            echo "mismatch rather than failing later with \`ERR_DLOPEN_FAILED\`."
            echo
            echo '`SHA256SUMS.txt` is verified by the installer automatically.'
            echo
            # Say what is NOT here, in the draft, before anyone publishes
            # it. A release missing an advertised download is the kind of
            # thing a reader finds before a maintainer does.
            if [ "${{ steps.assemble.outputs.exes }}" -eq 0 ]; then
              echo '> **The Windows installer is missing from this draft** — its build job did not'
              echo '> produce one. Do not publish while the Install section above offers it.'
              echo
            fi
            if [ "${{ steps.assemble.outputs.payloads }}" -lt 3 ]; then
              echo '> **Only '"${{ steps.assemble.outputs.payloads }}"' of 3 prebuilt payloads are here.** On the missing platform the'
              echo '> one-liner will stop and say so. Check which leg failed before publishing.'
              echo
            fi
            echo '---'
            echo
            echo 'Built by `.github/workflows/installer.yml`. Before publishing, run the'
            echo 'checklist in `installer/README.md` on a machine that is not the development one.'
          } > body.md
          cat body.md

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # A published release must never be turned back into a draft or
          # have its assets swapped underneath users. If the tag already
          # has a published release, refuse — uploading to it is exactly
          # the "unverified installer in front of users" this avoids.
          if gh release view "$tag" --json isDraft --jq .isDraft > state.txt 2>/dev/null; then
            if [ "$(cat state.txt)" = "false" ]; then
              echo "::error::${tag} is already PUBLISHED. Refusing to attach assets to a live release — cut a new tag."
              exit 1
            fi
            echo "Updating the existing draft for ${tag}"
            gh release edit "$tag" --draft --notes-file body.md
            gh release upload "$tag" out/* --clobber
          else
            echo "Creating a draft for ${tag}"
            gh release create "$tag" out/* \
              --draft \
              --title "$tag" \
              --notes-file body.md
          fi

          echo "::notice::Draft ${tag} ready — review it, run the checklist, then Publish."
          gh release view "$tag" --json isDraft,assets \
            --jq '"draft=\(.isDraft) assets=\(.assets | length)"'
